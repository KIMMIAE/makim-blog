<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Still Making · 선택한 고양이</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f8ff;color:#303443;font-family:system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:32px 24px}h1{font-size:28px;letter-spacing:-1px}p{color:#737787;line-height:1.6}h2{font-size:18px;margin:28px 0 16px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}article{background:#fff;border:1px solid #e6e7f0;border-radius:20px;text-align:center;padding:18px 4px}h3{font-size:14px;margin:0 0 8px}img{image-rendering:pixelated;object-fit:contain;max-width:100%}.actual{display:block;margin:6px auto 0}a{color:#5355e9}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}} </style>
<main><b>Still Making · CAT STUDY</b><h1>잠들고, 고개를 기울이고, 번쩍</h1><p>작고 둥근 얼굴과 반짝이는 눈으로 확정했어요. 아래에서 고양이를 잡고 움직여보세요.</p><section><h2>최종 선택 · 작고 둥근 얼굴 / 반짝이는 눈</h2><div class="grid"><article><h3>기본 앉기</h3><img width="128" height="128" src="c-awake.svg" alt="최종 선택 · 작고 둥근 얼굴 / 반짝이는 눈 기본 앉기"><img class="actual" width="64" height="64" src="c-awake.svg" alt="64px 기본 앉기"></article><article><h3>살짝 갸웃</h3><img width="128" height="128" src="c-tilt.svg" alt="최종 선택 · 작고 둥근 얼굴 / 반짝이는 눈 살짝 갸웃"><img class="actual" width="64" height="64" src="c-tilt.svg" alt="64px 살짝 갸웃"></article><article><h3>식빵 자세</h3><img width="128" height="128" src="c-loaf.svg" alt="최종 선택 · 작고 둥근 얼굴 / 반짝이는 눈 식빵 자세"><img class="actual" width="64" height="64" src="c-loaf.svg" alt="64px 식빵 자세"></article><article><h3>잠든 모습</h3><img width="128" height="128" src="c-sleep.svg" alt="최종 선택 · 작고 둥근 얼굴 / 반짝이는 눈 잠든 모습"><img class="actual" width="64" height="64" src="c-sleep.svg" alt="64px 잠든 모습"></article><article><h3>들어 올렸을 때</h3><img width="128" height="128" src="c-lifted.svg" alt="최종 선택 · 작고 둥근 얼굴 / 반짝이는 눈 들어 올렸을 때"><img class="actual" width="64" height="64" src="c-lifted.svg" alt="64px 들어 올렸을 때"></article></div></section><h2>마우스로 살짝 들어 올려보세요</h2><p>고양이를 누른 채 움직이면 들어 올린 자세로 바뀌고, 놓으면 앉습니다. 키보드는 고양이에 초점을 두고 Space 또는 Enter로 전환할 수 있어요.</p><div class="playgrounds"><div class="playground"><b>선택한 고양이</b><button class="draggable" data-cat="c" aria-label="C 고양이 들어 올리기" aria-pressed="false"><img draggable="false" src="c-awake.svg" alt=""></button></div></div><style>.playgrounds{display:grid;grid-template-columns:1fr;gap:16px}.playground{height:280px;background:#efedff;border-radius:24px;position:relative;overflow:hidden;padding:20px}.draggable{position:absolute;left:calc(50% - 64px);top:100px;width:128px;height:128px;border:0;background:transparent;padding:0;cursor:grab;touch-action:none;user-select:none}.draggable img{width:128px;height:128px;pointer-events:none}.draggable:active{cursor:grabbing}.draggable:focus-visible{outline:2px solid #7778ee;border-radius:12px}</style>
<script>
document.querySelectorAll('.draggable').forEach(button=>{
 const img=button.querySelector('img'),v=button.dataset.cat;let drag=null;
 function pose(up){img.src=v+(up?'-lifted.svg':'-awake.svg');button.setAttribute('aria-pressed',String(up));}
 button.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY};button.setPointerCapture(e.pointerId);pose(true);button.style.transform='translateY(-12px)';});
 button.addEventListener('pointermove',e=>{if(!drag)return;const limit=button.parentElement.clientWidth/2-64;const dx=Math.max(-limit,Math.min(limit,e.clientX-drag.x));const dy=Math.max(-90,Math.min(35,e.clientY-drag.y-12));button.style.transform=`translate(${dx}px,${dy}px)`;});
 function release(){drag=null;pose(false);button.style.transform='';}
 button.addEventListener('pointerup',release);button.addEventListener('pointercancel',release);button.addEventListener('lostpointercapture',release);
 button.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();const up=button.getAttribute('aria-pressed')!=='true';pose(up);button.style.transform=up?'translateY(-16px)':'';}if(e.key==='Escape')release();});
});
</script></main></html>
